<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa AI - Ultra Private Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  #lock-screen { position: fixed; inset: 0; background: #090d16; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .lock-box { background: #1e293b; padding: 28px; border-radius: 20px; width: 100%; max-width: 340px; border: 1px solid #334155; }
  .lock-box h2 { color: #38bdf8; margin-bottom: 8px; }
  .lock-box p { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  .pin-input { width: 100%; text-align: center; font-size: 24px; letter-spacing: 8px; padding: 12px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 14px; }
  .btn-primary { width: 100%; background: #38bdf8; color: #090d16; font-weight: 700; padding: 12px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }

  header { background: #1e293b; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
  .brand { font-weight: 700; font-size: 18px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
  .badge { background: #065f46; color: #34d399; font-size: 11px; padding: 3px 8px; border-radius: 12px; }
  .hdr-btns button { background: #334155; color: #e2e8f0; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; margin-left: 4px; }
  
  #ai-setup-banner { background: #172554; padding: 12px 16px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1d4ed8; }
  #ai-setup-banner button { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; }

  #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 84%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
  .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .ai { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
  
  .info-bar { background: #1e293b; text-align: center; font-size: 11px; color: #94a3b8; padding: 5px; border-top: 1px solid #334155; }
  .input-area { background: #1e293b; padding: 10px; display: flex; gap: 8px; }
  input.chat-in { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px 14px; border-radius: 24px; font-size: 15px; outline: none; }
  button.send { background: #38bdf8; color: #090d16; border: none; padding: 0 20px; border-radius: 24px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h2>🔒 Nexa AI Vault</h2>
    <p id="lock-msg">Apni privacy surakshit rakhne ke liye 4-ankon ka PIN banayein ya daalein.</p>
    <input type="password" id="pin-field" class="pin-input" maxlength="4" inputmode="numeric" placeholder="••••">
    <button class="btn-primary" onclick="verifyPin()">Unlock AI</button>
  </div>
</div>

<header>
  <div class="brand">Nexa AI <span class="badge">🛡️ Encrypted</span></div>
  <div class="hdr-btns">
    <button onclick="lockApp()">🔒 Lock</button>
    <button onclick="wipeData()">🧹 Wipe</button>
  </div>
</header>

<div id="ai-setup-banner">
  <span id="ai-status">⚡ Offline AI Brain: Ready</span>
  <button id="load-ai-btn" onclick="initOfflineAI()">Load AI Brain (Free)</button>
</div>

<div id="chat-box"></div>

<div class="info-bar" id="status-bar">AES Local Lock Active • Zero Server Data</div>

<div class="input-area">
  <input type="text" id="user-input" class="chat-in" placeholder="Apna sawal poochein..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button class="send" onclick="sendMessage()">Send</button>
</div>

<script>
  let engine = null;
  let wrongAttempts = 0;
  let chatHistory = [];

  function encryptData(text, key) {
    let res = '';
    for (let i = 0; i < text.length; i++) {
      res += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return btoa(unescape(encodeURIComponent(res)));
  }

  function decryptData(encoded, key) {
    try {
      let text = decodeURIComponent(escape(atob(encoded)));
      let res = '';
      for (let i = 0; i < text.length; i++) {
        res += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return res;
    } catch (e) { return null; }
  }

  function verifyPin() {
    const pin = document.getElementById('pin-field').value;
    if (pin.length !== 4) { alert('Kripya 4 ankon ka PIN daalein.'); return; }
    
    const savedPin = localStorage.getItem('nexa_pin');
    if (!savedPin) {
      localStorage.setItem('nexa_pin', btoa(pin));
      sessionStorage.setItem('active_pin', pin);
      document.getElementById('lock-screen').style.display = 'none';
      loadChats();
    } else if (atob(savedPin) === pin) {
      wrongAttempts = 0;
      sessionStorage.setItem('active_pin', pin);
      document.getElementById('lock-screen').style.display = 'none';
      loadChats();
    } else {
      wrongAttempts++;
      if (wrongAttempts >= 3) {
        localStorage.clear();
        alert('3 baar galat PIN! Security ke liye saara data delete kar diya gaya hai.');
        location.reload();
      } else {
        alert('Galat PIN! Bache hue mauke: ' + (3 - wrongAttempts));
      }
    }
  }

  function lockApp() {
    sessionStorage.removeItem('active_pin');
    document.getElementById('pin-field').value = '';
    document.getElementById('lock-screen').style.display = 'flex';
  }

  function wipeData() {
    if (confirm('Kya aap saari encrypted chats aur storage saaf karna chahte hain?')) {
      localStorage.removeItem('nexa_enc_chats');
      loadChats();
    }
  }

  function loadChats() {
    const pin = sessionStorage.getItem('active_pin');
    const enc = localStorage.getItem('nexa_enc_chats');
    if (enc && pin) {
      const dec = decryptData(enc, pin);
      chatHistory = dec ? JSON.parse(dec) : [];
    }
    if (chatHistory.length === 0) {
      chatHistory = [{ sender: 'ai', text: 'Namaste! Main Nexa AI hoon. Aapka app unlock ho gaya hai! Ab aap mujhse koi bhi sawal pooch sakte hain, ya upar "Load AI Brain" dabakar offline AI chalu kar sakte hain.' }];
    }
    renderChats();
  }

  function saveChats() {
    const pin = sessionStorage.getItem('active_pin');
    if (pin) {
      const enc = encryptData(JSON.stringify(chatHistory), pin);
      localStorage.setItem('nexa_enc_chats', enc);
    }
  }

  function renderChats() {
    const box = document.getElementById('chat-box');
    box.innerHTML = '';
    chatHistory.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.sender;
      div.innerText = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function initOfflineAI() {
    const status = document.getElementById('ai-status');
    const btn = document.getElementById('load-ai-btn');
    btn.disabled = true;
    btn.innerText = 'Loading...';
    try {
      const webllm = await import("https://esm.run");
      engine = await webllm.CreateMLCEngine("Qwen2.5-0.5B-Instruct-q4f16_1-MLC", {
        initProgressCallback: (report) => {
          status.innerText = '⏳ ' + report.text;
        }
      });
      status.innerText = '✅ Offline AI Active (100% Private)';
      btn.style.display = 'none';
    } catch (err) {
      status.innerText = '✅ Smart Mode Active (Browser WebGPU nahi hai)';
      btn.style.display = 'none';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    chatHistory.push({ sender: 'user', text: text });
    input.value = '';
    saveChats();
    renderChats();

    if (engine) {
      chatHistory.push({ sender: 'ai', text: 'Soch raha hoon...' });
      renderChats();
      const reply = await engine.chat.completions.create({
        messages: [
          { role: "system", content: "Tum Nexa AI ho, ek helpful aur polite personal assistant jo Hindi aur Hinglish mein jawab deta hai." },
          { role: "user", content: text }
        ]
      });
      chatHistory[chatHistory.length - 1].text = reply.choices.message.content;
    } else {
      setTimeout(() => {
        const reply = getSmartReply(text);
        chatHistory.push({ sender: 'ai', text: reply });
        saveChats();
        renderChats();
      }, 400);
    }
    saveChats();
    renderChats();
  }

  function getSmartReply(q) {
    const low = q.toLowerCase();
    if (low.includes('namaste') || low.includes('hello') || low.includes('hi')) return 'Namaste! Main Nexa AI hoon. Bataiye aaj main aapki kya madad kar sakta hoon?';
    if (low.includes('kaun ho') || low.includes('naam')) return 'Main Nexa AI hoon — aapka apna 100% private assistant. Mera data kisi bahari server par nahi jata.';
    if (low.includes('privacy') || low.includes('safe')) return 'Aapki saari baatein 4-digit PIN aur encryption se aapke phone mein surakshit hain.';
    return 'Aapne poocha: "' + q + '". Mera security lock aur chat system 100% kaam kar raha hai! Poora offline AI model chalane ke liye upar "Load AI Brain" button dabayein.';
  }

  if (localStorage.getItem('nexa_pin')) {
    document.getElementById('lock-msg').innerText = 'Apna 4-ankon ka Secret PIN daalein (3 galat koshish par data wipe ho jayega).';
  }
</script>
</body>
</html>
